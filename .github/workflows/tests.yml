name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: python -m compileall -q rdtx tests experiments

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Verify package metadata
        run: python -m pip install --no-deps .

      - name: Verify installed CLI
        run: |
          rdtx --version
          rdtx-send --help
          rdtx-receive --help
          rdtx-benchmark --help

      - name: Run benchmark smoke test
        if: matrix.python-version == '3.12'
        run: |
          rdtx benchmark --size-kib 8 --output /tmp/rdtx-benchmark.csv --markdown /tmp/rdtx-benchmark.md
          test -s /tmp/rdtx-benchmark.csv
          test -s /tmp/rdtx-benchmark.md
