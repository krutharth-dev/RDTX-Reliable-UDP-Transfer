name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install .

      - name: Compile source
        run: python -m compileall -q rdtx experiments webapp tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify commands
        run: |
          rdtx --version
          rdtx-web --help
          rdtx-web --version

      - name: Benchmark smoke test
        if: matrix.python-version == '3.12'
        run: |
          rdtx benchmark --size-kib 8 --output /tmp/rdtx-benchmark.csv --markdown /tmp/rdtx-benchmark.md
          test -s /tmp/rdtx-benchmark.csv
          test -s /tmp/rdtx-benchmark.md
